name: Build Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Install EAS CLI Globally
        run: npm install -g eas-cli

      - name: Build Standalone APK
        run: eas build --platform android --profile preview --non-interactive --auto-submit=false
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
